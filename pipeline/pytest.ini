[pytest]
# Unit and integration tests for looma_pipeline. Run inside the image: make pipeline-test
testpaths = tests
addopts = -ra --strict-markers -p no:cacheprovider
markers =
    model: needs the prepared embedder in PIPELINE_DATA_DIR/models (run make pipeline-model first)
    mongo: reads the local looma-db (read only)
# PyMuPDF's SWIG bindings trigger this on import under Python 3.12; it is not about our code.
filterwarnings =
    ignore:builtin type .* has no __module__ attribute:DeprecationWarning
